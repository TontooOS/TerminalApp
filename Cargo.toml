[package]
name = "terminal"
version = "27.0.0"
edition = "2021"
description = "Terminal for TontooOS"
readme = "README.md"

[[bin]]
name = "terminal"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["TontooUI", "Foundation", "Accessibility"] }
libc = "0.2"